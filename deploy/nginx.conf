# /etc/nginx/conf.d/presence.conf — reverse proxy ke server Node (HTTPS lewat certbot)
server {
    listen 80;
    server_name dashboard.contoh.com;   # ganti

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # SSE (update live): jangan di-buffer
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
