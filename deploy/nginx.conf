# /etc/nginx/conf.d/presence.conf — frontend statis (hasil `npm run build` di web/)
server {
    listen 80;
    server_name dashboard.contoh.com;   # ganti
    root /home/USERNAME/presence_dashboard/web/dist;   # ganti USERNAME
    index index.html;

    location / { try_files $uri /index.html; }           # SPA fallback
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
}
